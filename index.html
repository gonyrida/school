<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Default SEO. These get overwritten per-route by usePageSEO() once React mounts. -->
    <title>Norol Iman High School — Excellence in Education</title>
    <meta name="description" content="A modern learning environment rooted in faith and excellence. Norol Iman Chroy Metrey School (NICS) — Phnom Penh, Cambodia." />
    <link rel="canonical" href="https://noroliman.com/" />

    <!-- Open Graph defaults -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Norol Iman High School" />
    <meta property="og:title" content="Norol Iman High School — Excellence in Education" />
    <meta property="og:description" content="A modern learning environment rooted in faith and excellence. Phnom Penh, Cambodia." />
    <meta property="og:url" content="https://noroliman.com/" />
    <meta property="og:image" content="https://noroliman.com/og-default.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en" />
    <meta property="og:image:alt" content="Norol Iman High School campus and students" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Norol Iman High School" />
    <meta name="twitter:description" content="A modern learning environment rooted in faith and excellence." />
    <meta name="twitter:image" content="https://noroliman.com/og-default.jpg" />
    <meta name="twitter:image:alt" content="Norol Iman High School" />

    <!-- Theme colour for mobile browser chrome -->
    <meta name="theme-color" content="#1f2f7d" />

    <!-- Performance: preconnect / dns-prefetch to third parties hit on every page -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://www.google.com" />

    <!-- Google Analytics (Gtag) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9XC39D2CLS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);} 
      gtag('js', new Date());

      gtag('config', 'G-9XC39D2CLS');
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Noto+Sans+Khmer:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
